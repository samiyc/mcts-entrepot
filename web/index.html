<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robots d'entrepôt</title>
    <link rel="stylesheet" href="../node_modules/mcts-commun/web/theme.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "mcts-commun/": "../node_modules/mcts-commun/src/" } }
    </script>
  </head>
  <body>
    <header class="masthead topbar">
      <p class="links"><a href="changelog.html">Journal des versions, et ce que gagne la recherche</a></p>
      <h1>Robots d'entrepôt</h1>
      <nav class="tabs" role="tablist" aria-label="Simulation">
        <button type="button" role="tab" data-tab="entrepot" aria-selected="true" title="Des robots portent les commandes des rayons aux camions">Entrepôt</button>
        <button type="button" role="tab" data-tab="comparaisons" aria-selected="false" title="Les règles et la recherche sur les mêmes journées">Comparaisons</button>
        <button type="button" role="tab" data-tab="replays" aria-selected="false" title="Les journées jouées jusqu'au bout, à revoir coup pour coup">Replays</button>
        <button type="button" role="tab" data-tab="stats" aria-selected="false" title="Les mesures de nuit, et la dernière comparaison journée par journée">Stats</button>
      </nav>
    </header>
    <main class="layout" id="layout">
      <aside class="sidebar" id="sidebar" aria-label="Réglages"></aside>
      <section class="view" id="app" aria-live="off"></section>
    </main>
    <button type="button" id="fold" class="quiet sidebar-fold" aria-expanded="true" title="Replier le panneau">«</button>
    <script type="module" src="app.js"></script>
  </body>
